# Netlify configuration for JKB Software Website

[build]
  publish = "."

# Hinweis: Formular-Benachrichtigungen werden im Netlify-Dashboard
# konfiguriert (Forms → Notifications), nicht in dieser Datei.

# Redirects
[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
