<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDITH – Unternehmens-KI | JKB Software</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: .35;
    pointer-events: none;
  }
  .glow-1 { background: #6366f1; top: -200px; left: -150px; }
  .glow-2 { background: #06b6d4; bottom: -250px; right: -150px; animation: pulse 6s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity:.2; } to { opacity:.45; } }
  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 64px 48px;
    max-width: 560px;
    margin: 20px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .badge {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a5b4fc;
    background: rgba(99,102,241,.12);
    border: 1px solid rgba(99,102,241,.35);
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 18px;
    background: linear-gradient(135deg, #fff 30%, #818cf8);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { color: rgba(255,255,255,.65); font-size: 1.05rem; line-height: 1.7; margin-bottom: 36px; }
  .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 14px 30px;
    border-radius: 999px;
    font-weight: 600;
    font-size: .95rem;
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: #fff;
    box-shadow: 0 8px 28px rgba(99,102,241,.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(99,102,241,.5); }
  .btn-ghost {
    color: rgba(255,255,255,.8);
    border: 1px solid rgba(255,255,255,.2);
  }
  .btn-ghost:hover { background: rgba(255,255,255,.07); }
  .footer-note { position: absolute; bottom: 28px; z-index: 1; color: rgba(255,255,255,.35); font-size: .85rem; }
</style>
<link rel="shortcut icon" type="image/png" href="/Assets/logoohnehintergund.png">
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="card">
    <span class="badge">Unternehmens-KI</span>
    <h1>EDITH</h1>
    <p>EDITH ist unsere selbst entwickelte Unternehmens-KI mit eigener Wissensdatenbank und direkter ERP-Anbindung. Erfahren Sie, was EDITH für Ihr Unternehmen leisten kann.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/contact">Jetzt informieren lassen</a>
      <a class="btn btn-ghost" href="/">Zur Startseite</a>
    </div>
  </div>
  <div class="footer-note">© JKB Software · jkb-software.com</div>
<footer style="text-align:center;padding:32px 16px;font-size:14px;opacity:.7">
<a href="/impressum" style="color:inherit;margin:0 10px">Impressum</a>|
<a href="/privacy-policy" style="color:inherit;margin:0 10px">Datenschutz</a>|
<a href="/term-and-condition" style="color:inherit;margin:0 10px">AGB</a>
</footer>
</body>
</html>
