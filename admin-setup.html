<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Account erstellen - JKB Grounds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }
        
        .setup-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 4rem 3rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            animation: scaleIn 0.5s ease-out 0.3s backwards;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin-bottom: 2.5rem;
            text-align: center;
            font-weight: 400;
        }
        
        .club-name {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .club-name-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        
        .club-name-text {
            color: #667eea;
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .form-grid {
            display: grid;
            gap: 1.2rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .form-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.9rem 1rem;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .password-requirements {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .password-requirements h4 {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        
        .password-requirements ul {
            list-style: none;
            padding: 0;
        }
        
        .password-requirements li {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            padding: 0.2rem 0;
            padding-left: 1.2rem;
            position: relative;
        }
        
        .password-requirements li::before {
            content: "○";
            position: absolute;
            left: 0;
        }
        
        .password-requirements li.valid {
            color: #10b981;
        }
        
        .password-requirements li.valid::before {
            content: "✓";
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #ef4444;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .submit-button {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            margin-top: 1.5rem;
        }
        
        .submit-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
        
        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        @media (max-width: 768px) {
            .setup-container {
                padding: 3rem 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="icon">👤</div>
        <h1>Admin-Account erstellen</h1>
        <p class="subtitle">Fast geschafft! Erstelle jetzt deinen Admin-Zugang für die Platzverwaltung.</p>
        
        <div class="club-name">
            <div class="club-name-label">Dein Verein</div>
            <div class="club-name-text" id="clubNameDisplay">-</div>
        </div>
        
        <form id="adminForm" onsubmit="handleSubmit(event)">
            <div class="error-message" id="errorMessage"></div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Vollständiger Name *</label>
                    <input type="text" id="name" name="name" placeholder="Max Mustermann" required>
                </div>
                
                <div class="form-group">
                    <label for="email">E-Mail-Adresse *</label>
                    <input type="email" id="email" name="email" placeholder="max@verein.de" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Passwort *</label>
                    <input type="password" id="password" name="password" placeholder="Mindestens 8 Zeichen" required>
                </div>
                
                <div class="form-group">
                    <label for="passwordConfirm">Passwort bestätigen *</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Passwort wiederholen" required>
                </div>
                
                <div class="password-requirements">
                    <h4>Passwort-Anforderungen:</h4>
                    <ul>
                        <li id="req-length">Mindestens 8 Zeichen</li>
                        <li id="req-match">Passwörter stimmen überein</li>
                    </ul>
                </div>
                
                <button type="submit" class="submit-button" id="submitBtn">
                    ✓ Admin-Account erstellen
                </button>
            </div>
        </form>
    </div>
    
    <script>
        // Get club info from URL
        const urlParams = new URLSearchParams(window.location.search);
        const clubId = urlParams.get('club_id');
        const clubName = urlParams.get('club_name');
        
        if (clubName) {
            document.getElementById('clubNameDisplay').textContent = decodeURIComponent(clubName);
        }
        
        if (!clubId) {
            alert('Fehler: Keine Vereins-ID gefunden. Bitte starte den Registrierungsprozess erneut.');
        }
        
        // Password validation
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        
        function validatePassword() {
            const password = passwordInput.value;
            const passwordConfirm = passwordConfirmInput.value;
            
            // Check length
            const lengthReq = document.getElementById('req-length');
            if (password.length >= 8) {
                lengthReq.classList.add('valid');
            } else {
                lengthReq.classList.remove('valid');
            }
            
            // Check match
            const matchReq = document.getElementById('req-match');
            if (password && passwordConfirm && password === passwordConfirm) {
                matchReq.classList.add('valid');
            } else {
                matchReq.classList.remove('valid');
            }
        }
        
        passwordInput.addEventListener('input', validatePassword);
        passwordConfirmInput.addEventListener('input', validatePassword);
        
        async function handleSubmit(event) {
            event.preventDefault();
            
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            
            // Hide previous errors
            errorMessage.style.display = 'none';
            
            // Get form data
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            
            // Validate
            if (password.length < 8) {
                errorMessage.textContent = 'Passwort muss mindestens 8 Zeichen lang sein.';
                errorMessage.style.display = 'block';
                return;
            }
            
            if (password !== passwordConfirm) {
                errorMessage.textContent = 'Die Passwörter stimmen nicht überein.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Admin wird erstellt...';
            
            try {
                // Send to Netlify Function
                const response = await fetch('/.netlify/functions/create-admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password,
                        clubId: clubId,
                        roleId: '1f5a5ff7-c0cb-449d-b30c-a86c691be432'
                    }),
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || 'Fehler beim Erstellen des Admin-Accounts');
                }
                
                console.log('Admin created successfully:', result);
                
                // Success - redirect to final success page
                window.location.href = '/register-success.html?club_id=' + 
                    encodeURIComponent(clubId) + 
                    '&club_name=' + encodeURIComponent(clubName);
                
            } catch (error) {
                console.error('Error creating admin:', error);
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        }
    </script>
</body>
</html>
